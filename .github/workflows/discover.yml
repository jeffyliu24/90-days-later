name: Discover review candidates

on:
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * 2,5"
      timezone: "Asia/Shanghai"

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Discover candidates
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/discover.py
      - name: Upload private review artifact
        uses: actions/upload-artifact@v4
        with:
          name: candidate-brief-${{ github.run_id }}
          path: |
            data/candidates/*.json
            content/drafts/candidate-brief-*.md
          if-no-files-found: error
          retention-days: 30

